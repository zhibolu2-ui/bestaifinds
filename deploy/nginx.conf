server {
    listen 80;
    server_name bestaifinds.com www.bestaifinds.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bestaifinds.com www.bestaifinds.com;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/bestaifinds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bestaifinds.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;

    # Static files caching
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /icons {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Upload size limit for video processing
    client_max_body_size 50M;

    # Proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for video processing
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
